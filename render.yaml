services:
  - type: web
    name: coleta-dados-web
    runtime: node
    plan: free
    region: oregon
    rootDir: front-end
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/dashboard/stats
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
