services:
  postgres:
    image: postgres:16-alpine
    container_name: coleta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: coleta_dados
    ports:
      - "5432:5432"
    volumes:
      - coleta_postgres_data:/var/lib/postgresql/data

volumes:
  coleta_postgres_data:
